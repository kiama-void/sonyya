title: Sonyya
email: your-email@example.com
author: Sonyya
description: >-
  A research-oriented personal blog about AI, engineering, mathematics,
  and careful technical thinking.
baseurl: "/sonyya"
url: "https://kiama-void.github.io"

# Used by the /admin/ writing page to publish via the GitHub API
github_repo: "kiama-void/sonyya"
github_branch: "main"

# "Write about it later" ideas, managed from /admin/. Stored in this repo under
# _ideas/ (folders starting with _ are not published, so ideas never appear on the site).
ideas_repo: "kiama-void/sonyya"
ideas_path: "_ideas/ideas.json"

permalink: /:categories/:title/

# Short posts (like tweets). Files live in _thoughts/
collections:
  thoughts:
    output: true
    permalink: /thoughts/:name/

defaults:
  - scope:
      path: ""
      type: thoughts
    values:
      layout: thought

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - vendor/
  - node_modules/
  - README.md
  - serve.sh
  - Gemfile
  - Gemfile.lock
