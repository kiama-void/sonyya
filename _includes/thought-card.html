{%- assign t = include.thought -%}
{%- capture label -%}{% if t.heading %}{{ t.heading }}{% else %}{{ t.content | strip_html | normalize_whitespace | truncate: 90 }}{% endif %}{%- endcapture -%}
<details class="thought-card">
  <summary>
    <span class="thought-title">{{ label }}</span>
    <time datetime="{{ t.date | date_to_xmlschema }}">{{ t.date | date: "%b %-d" }}</time>
  </summary>
  <div class="thought-body">
    <div class="thought-text">{{ t.content }}</div>
    <div class="thought-foot">
      {% include tag-list.html tags=t.tags %}
      <a class="thought-permalink" href="{{ t.url | relative_url }}">Open ↗</a>
    </div>
  </div>
</details>
